[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "openwakeword",
    "pyaudio",
    "livekit-api",
    "pytest",
    "ddgs",          # web search backend used by search_web tool
    "keyboard; sys_platform == 'win32'",  # global hotkeys (kill switch, restart)
    "resemblyzer",   # speaker verification
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "python-dateutil",
    "pycaw; sys_platform == 'win32'",
    "comtypes; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",   # .lnk target resolution in tools/apps.py
    # <6.12: 6.12.0 under-counts None on every void call and aborts Python 3.11.
    "PySide6-Essentials>=6.7,<6.12; sys_platform == 'linux'",  # click-through overlay renderer
    "jeepney; sys_platform == 'linux'",  # D-Bus service for the KRunner plugin
    "psutil",        # sysmon tool, process checks, tree-kill
    "pillow",        # screen capture for read_screen
    "sounddevice",   # SESSION_MIC selection (also livekit's console audio)
    "torch",         # resemblyzer backend; pinned to the CPU build on Linux below
    "pyautogui",     # mouse-wheel scroll for read_long_content (scroll-capture)
    "vosk>=0.3.45", # closed-grammar STT for launcher fast-path commands
    "webrtcvad",    # tail endpointing (already used by friday/webrtc_vad.py, was undeclared)
]

[project.scripts]
friday = "server:main"
friday_voice = "agent_friday:dev"
friday_start = "friday_launcher:main"
friday_ctl = "friday_ctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

# PyPI's Linux torch wheel bundles several GB of CUDA libraries. Resemblyzer
# only embeds 2.5s clips, so the CPU build is plenty (and is what Windows gets).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
